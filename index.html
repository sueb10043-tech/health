<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>급식 메뉴 달력</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .wrapper { max-width: 1000px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    header { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid #f1f5f9; height: 60px; display: flex; align-items: center; padding: 0 16px; }
    header h1 { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 700; color: #1e293b; white-space: nowrap; }
    .nav-btn { background: none; border: none; font-size: 20px; color: #94a3b8; cursor: pointer; padding: 6px 12px; border-radius: 50%; transition: background 0.15s; }
    .nav-btn:hover { background: #f1f5f9; }
    .nav-btn:last-of-type { margin-left: auto; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; margin-left: 10px; flex-shrink: 0; transition: background 0.3s; }
    #status-dot.loading { background: #38bdf8; animation: blink 1s infinite; }
    #status-dot.ok { background: #4ade80; }
    #status-dot.error { background: #f87171; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .cal-head { display: grid; grid-template-columns: repeat(7,1fr); background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
    .cal-head span { text-align: center; font-size: 11px; font-weight: 700; padding: 8px 0; color: #94a3b8; letter-spacing: 0.05em; }
    .cal-head span:first-child { color: #f43f5e; }
    .cal-head span:last-child { color: #0ea5e9; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); }
    .day-cell { min-height: 110px; border-bottom: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; padding: 6px; display: flex; flex-direction: column; cursor: pointer; position: relative; overflow: hidden; transition: background 0.15s; }
    .day-cell:hover { background: #f0f9ff; }
    .day-cell.today { outline: 2.5px solid #0ea5e9; outline-offset: -2.5px; border-radius: 4px; z-index: 2; }
    .day-cell.empty { background: #fafafa; cursor: default; pointer-events: none; }
    .day-cell.weekend { background: #fafafa; }
    .day-cell.no-meal { cursor: default; }
    .day-cell.no-meal:hover { background: #fafafa; }
    .day-cell.copied { background: #ecfdf5 !important; transition: background 0s; }
    .day-num { font-size: 12px; font-weight: 700; color: #1e293b; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 3px; }
    .day-num.sun { color: #f43f5e; }
    .day-num.sat { color: #0ea5e9; }
    .menu-text { font-size: 10px; color: #475569; line-height: 1.6; overflow: hidden; flex: 1; word-break: keep-all; white-space: pre-line; }
    .copy-toast { position: absolute; bottom: 5px; right: 5px; background: #0ea5e9; color: white; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .copy-toast.show { opacity: 1; }
    @media (max-width: 640px) {
      .day-cell { min-height: 80px; padding: 4px; }
      .menu-text { font-size: 9px; line-height: 1.5; }
      .day-num { font-size: 11px; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <header>
    <button class="nav-btn" onclick="changeMonth(-1)">〈</button>
    <h1 id="title">로딩 중...</h1>
    <button class="nav-btn" onclick="changeMonth(1)">〉</button>
    <div id="status-dot"></div>
  </header>
  <div class="cal-head">
    <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx72m2i7lsIYc63anddGvk0kVYhlKFMmhMdk5PSqwsNf7NqgxoBZjRyEAilw-UU2oEI/exec";

  let currentMonth = new Date();
  let menuCache = {};

  function pad(n) { return String(n).padStart(2, '0'); }

  function setStatus(type) {
    const dot = document.getElementById('status-dot');
    dot.className = type;
    if (type === 'ok') setTimeout(() => { dot.className = ''; }, 2000);
  }

  async function fetchMenus(yr, mo) {
    const cacheKey = `${yr}${pad(mo + 1)}`;
    if (menuCache[cacheKey]) return menuCache[cacheKey];
    setStatus('loading');
    try {
      const url = `${SCRIPT_URL}?yr=${yr}&mo=${pad(mo + 1)}&t=${Date.now()}`;
      const res  = await fetch(url, { cache: 'no-store' });
      const data = await res.json();
      if (data.result === 'success') {
        menuCache[cacheKey] = data.menus;
        setStatus('ok');
        return data.menus;
      } else {
        setStatus('error');
        return {};
      }
    } catch(e) {
      setStatus('error');
      return {};
    }
  }

  async function renderCalendar() {
    const yr = currentMonth.getFullYear();
    const mo = currentMonth.getMonth();
    document.getElementById('title').textContent = `${yr}년 ${mo + 1}월`;
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    const firstDay = new Date(yr, mo, 1).getDay();
    const lastDate = new Date(yr, mo + 1, 0).getDate();
    const now      = new Date();
    const todayKey = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'day-cell empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= lastDate; d++) {
      const dateKey = `${yr}${pad(mo+1)}${pad(d)}`;
      const dow = new Date(yr, mo, d).getDay();
      const isToday   = dateKey === todayKey;
      const isWeekend = dow === 0 || dow === 6;

      const cell = document.createElement('div');
      cell.className = 'day-cell' + (isToday ? ' today' : '') + (isWeekend ? ' weekend' : '');
      cell.dataset.datekey = dateKey;

      const numEl = document.createElement('div');
      numEl.className = 'day-num' + (dow === 0 ? ' sun' : dow === 6 ? ' sat' : '');
      numEl.textContent = d;

      const menuEl = document.createElement('div');
      menuEl.className = 'menu-text';
      menuEl.id = `menu-${dateKey}`;

      const toast = document.createElement('div');
      toast.className = 'copy-toast';
      toast.textContent = '복사됨 ✓';

      cell.appendChild(numEl);
      cell.appendChild(menuEl);
      cell.appendChild(toast);
      cell.onclick = () => copyMenu(dateKey, cell, toast);
      grid.appendChild(cell);
    }

    const menus = await fetchMenus(yr, mo);

    for (let d = 1; d <= lastDate; d++) {
      const dateKey = `${yr}${pad(mo+1)}${pad(d)}`;
      const cell    = document.querySelector(`[data-datekey="${dateKey}"]`);
      const menuEl  = document.getElementById(`menu-${dateKey}`);
      if (!menuEl || !cell) continue;

      const menu = menus[dateKey];
      if (menu) {
        const lines = menu.split('\n');
        menuEl.textContent = lines.slice(0, 4).join('\n') + (lines.length > 4 ? '\n…' : '');
        menuEl.dataset.full = menu;
      } else {
        cell.classList.add('no-meal');
        cell.onclick = null;
      }
    }
  }

  async function copyMenu(dateKey, cell, toast) {
    const menuEl = document.getElementById(`menu-${dateKey}`);
    const menu   = menuEl?.dataset.full;
    if (!menu) return;
    try {
      await navigator.clipboard.writeText(menu);
    } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = menu;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    cell.classList.add('copied');
    toast.classList.add('show');
    setTimeout(() => {
      cell.classList.remove('copied');
      toast.classList.remove('show');
    }, 1200);
  }

  function changeMonth(d) {
    currentMonth.setMonth(currentMonth.getMonth() + d);
    renderCalendar();
  }

  renderCalendar();
</script>
</body>
</html>
